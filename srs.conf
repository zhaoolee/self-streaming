listen              1935;
max_connections     1000;
daemon              off;

# HTTP server: 提供 flv/hls 访问
http_server {
    enabled         on;
    listen          38081;
    dir             ./objs/nginx/html;
}

# HTTP API: 调试查看状态
http_api {
    enabled         on;
    listen          1985;
}

vhost __defaultVhost__ {
    # HLS 输出（m3u8/ts）
    hls {
        enabled         on;
        hls_path        ./objs/nginx/html;
        hls_fragment    2;
        hls_window      10;
    }

    # HTTP-FLV 输出（.flv）
    http_remux {
        enabled     on;
        mount       [vhost]/[app]/[stream].flv;
    }
}
